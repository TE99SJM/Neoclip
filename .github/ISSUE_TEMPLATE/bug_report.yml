name: Bug report
description: Report a reproducible problem with NeoClip
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting an issue. **Do not share private videos, secrets, or public access links to a running NeoClip server.**
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the unexpected behavior.
      placeholder: A clip render failed when...
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open NeoClip
        2. Select a video
        3. Mark in/out
        4. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "OS, browser, Python, FFmpeg and NeoClip build/version"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots (optional)
      description: Remove sensitive paths, filenames and secrets before sharing.
