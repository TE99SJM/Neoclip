
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1, viewport-fit=cover">

    <title>NeoClip Remote</title>
    <meta name="theme-color" content="#111111">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="NeoClip">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/static/icon-192.png">

    <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 14px;
            background: #111;
            color: #fff;
            font-family: system-ui, sans-serif;
            padding-bottom: max(14px, env(safe-area-inset-bottom));
        }

        main {
            width: min(900px, 100%);
            margin: 0 auto;
        }

        video {
            width: 100%;
            max-height: 55vh;
            background: #000;
            border-radius: 10px;
        }
        .video-stage {
            position: relative;
            width: 100%;
            min-height: 170px;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
        }
        .video-stage video { display: block; min-height: 170px; }
        .player-loading {
            position: absolute;
            inset: 0;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 12px;
            padding: 16px 16px 46px;
            background: rgba(0, 0, 0, .48);
            color: #fff;
            pointer-events: none;
            text-align: center;
        }
        .loading-ring {
            width: 38px;
            height: 38px;
            border: 3px solid rgba(255,255,255,.28);
            border-top-color: #83cfff;
            border-radius: 50%;
            animation: player-spin .8s linear infinite;
        }
        .loading-copy {
            max-width: 95%;
            padding: 6px 10px;
            background: rgba(0,0,0,.75);
            border-radius: 6px;
            font-size: 14px;
            line-height: 1.4;
        }
        @keyframes player-spin { to { transform: rotate(360deg); } }
        @media (prefers-reduced-motion: reduce) {
            .loading-ring { animation: none; border-top-color: #fff; }
        }

        button, input, select {
            min-height: 48px;
            border: 0;
            border-radius: 8px;
            padding: 10px;
            font-size: 16px;
        }

        button { cursor: pointer; }

        .danger {
            background: #8a1f1f;
            color: #fff;
        }

        .danger:hover {
            background: #a52727;
        }

        .panel {
            margin-top: 12px;
            padding: 12px;
            background: #1d1d1d;
            border-radius: 10px;
        }

        .grid-5 {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
            margin-top: 8px;
        }

        /* Phones get the stacked playback-control layout. */
        html.phone .player-controls {
            grid-template-columns: repeat(2, minmax(0, 1fr));
            grid-template-areas:
                "back-10 forward-10"
                "back-30 forward-30"
                "play-pause play-pause";
        }

        html.phone .player-controls .back-10 { grid-area: back-10; }
        html.phone .player-controls .forward-10 { grid-area: forward-10; }
        html.phone .player-controls .back-30 { grid-area: back-30; }
        html.phone .player-controls .forward-30 { grid-area: forward-30; }
        html.phone .player-controls .play-pause { grid-area: play-pause; }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 8px;
        }

        .field {
            width: 100%;
            margin-top: 8px;
        }

        .clip {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 8px;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #333;
        }

        .clip:last-child { border-bottom: 0; }

        .status {
            color: #aaa;
            overflow-wrap: anywhere;
        }

        .file-button {
            display: block;
            width: 100%;
            margin: 6px 0;
            text-align: left;
            overflow-wrap: anywhere;
        }

        .path {
            display: block;
            margin-top: 4px;
            font-size: 12px;
            opacity: 0.65;
        }

        progress {
            width: 100%;
            height: 24px;
            margin-top: 10px;
        }

        .hidden { display: none; }
        #pipelineStatus:empty, #selectedFile:empty { display: none; }

        @media (max-width: 520px) {
            .grid-5 {
                grid-template-columns: repeat(3, 1fr);
            }
            .player-controls { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .player-controls .play-pause { grid-column: 1 / -1; grid-row: 3; }
            .grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            h1 { font-size: 24px; }
            video { max-height: 45svh; }
        }
        input, select { min-width: 0; max-width: 100%; }
        button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid #83cfff; outline-offset: 2px; }
        button:disabled { opacity: .55; cursor: not-allowed; }
        .speed-control select { width: 100%; min-height: 44px; font-size: 16px; }
        .mark-controls button, .jump-controls button, .jump-controls input { min-height: 44px; }
        .jump-controls input { width: 100%; box-sizing: border-box; font-size: 16px; }
        .clock { font-variant-numeric: tabular-nums; }
        .edit-controls .player-controls { margin-top: 0; }
        .edit-controls .status { margin: 8px 0; }
        .clip-add-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin-top: 8px; }
        .clip-add-row input { width: 100%; }
        .clip-add-row button { padding: 10px 18px; }
        .brand { display: flex; gap: 10px; align-items: center; }
        .brand svg { width: 28px; height: 28px; color: #83cfff; }
    </style>
</head>

<body>
<main>
    <h1 class="brand"><svg viewBox="0 0 32 32" role="img" aria-label="NeoClip logo"><path d="M4 6h9v4H8v12h5v4H4zm24 0h-9v4h5v12h-5v4h9z" fill="currentColor"/><path d="m13 11 8 5-8 5z" fill="currentColor"/></svg>NeoClip Remote</h1>

    <section id="playerSection" class="hidden">
        <p id="selectedFile" class="status"></p>

        <div id="videoStage" class="video-stage" aria-busy="false">
        <video id="video"
               controls
               playsinline
               webkit-playsinline
               preload="metadata"></video>
        <div id="playerLoading" class="player-loading hidden"
             role="status" aria-live="polite" aria-atomic="true">
            <span class="loading-ring" aria-hidden="true"></span>
            <span id="playerLoadingText" class="loading-copy">Preparing preview…</span>
        </div>
        </div>

        <!-- Editing controls: skip/play, then Mark In/Out, then clip name + Add Clip -->
        <div class="panel edit-controls">
            <div class="grid-5 player-controls" role="group" aria-label="Playback controls">
                <button class="back-30" onclick="skip(-30)">−30</button>
                <button class="back-10" onclick="skip(-10)">−10</button>
                <button class="play-pause" onclick="togglePlayback()">Play/Pause</button>
                <button class="forward-10" onclick="skip(10)">+10</button>
                <button class="forward-30" onclick="skip(30)">+30</button>
            </div>
            <p id="sourceClock" class="status clock" aria-live="off">00:00 / 00:00</p>

            <div class="grid-2 mark-controls" role="group" aria-label="Clip markers">
                <button type="button" onclick="markIn()">Mark In</button>
                <button type="button" onclick="markOut()">Mark Out</button>
            </div>

            <div class="clip-add-row">
                <input id="clipName"
                       placeholder="Clip name (optional)"
                       aria-label="Clip name">
                <button type="button" onclick="addClip()">Add Clip</button>
            </div>
            <p id="markStatus" class="status">
                IN: not set<br>
                OUT: not set
            </p>
            <p id="pipelineStatus" class="status" aria-live="polite"></p>
        </div>

        <div class="panel speed-control">
            <label for="playbackSpeed">Playback speed</label>
            <select id="playbackSpeed" aria-label="Playback speed">
                <option value="1.0" selected>1.0x</option>
                <option value="1.25">1.25x</option>
                <option value="1.5">1.5x</option>
                <option value="1.75">1.75x</option>
                <option value="2.0">2.0x</option>
                <option value="2.5">2.5x</option>
                <option value="3.0">3.0x</option>
                <option value="3.5">3.5x</option>
                <option value="4.0">4.0x</option>
                <option value="4.5">4.5x</option>
                <option value="5.0">5.0x</option>
            </select>
            <p id="speedStatus" class="status" role="status" aria-live="polite"></p>
        </div>




        <div class="panel">
            <h2>Clip Queue</h2>
            <div id="clipList"></div>
            <button class="field" onclick="clearClips()">Clear All</button>
        </div>

        <div class="panel">
            <h2>Render</h2>

            <select id="renderMode" class="field">
                <option value="individual">Individual Clips</option>
                <option value="reel">Highlight Reel</option>
                <option value="both">Both</option>
            </select>

            <input id="prefix"
                   class="field"
                   value="neoclip_output"
                   placeholder="Output prefix">

            <div class="grid-2">
                <button onclick="startRender()">Render</button>
                <button onclick="cancelRender()">Cancel</button>
            </div>

            <progress id="progress" max="100" value="0"></progress>
            <p id="renderStatus" class="status">Idle</p>
        </div>

        <div class="panel">
            <button class="field danger" onclick="deleteVideo()">Delete this video</button>
            <p class="status">Removes the source file and its proxy from disk. You will be asked to confirm.</p>
        </div>

        <div class="panel jump-controls">
            <label for="jumpTime">Go to time</label>
            <div class="grid-2">
                <input id="jumpTime" placeholder="1:00:00" inputmode="decimal" aria-describedby="jumpTimeHelp">
                <button type="button" onclick="jumpToTime()">Go to time</button>
            </div>
            <p id="jumpTimeHelp" class="status">Enter seconds, mm:ss, or hh:mm:ss.</p>
        </div>
    </section>

    <section class="panel">
        <h2>Videos</h2>
        <p id="fileStatus" class="status">Loading videos…</p>
        <div id="files"></div>
    </section>
</main>

<script>
    const isPhone = /iPhone|iPod/i.test(navigator.userAgent) ||
                    /Android.*Mobile/i.test(navigator.userAgent);

    if (isPhone) {
        document.documentElement.classList.add("phone");
    }

    const video = document.getElementById("video");
    const playbackSpeed = document.getElementById("playbackSpeed");
    const playbackRates = new Set(Array.from(playbackSpeed.options, option => Number(option.value)));
    let selectedPlaybackRate = 1;

    function applyPlaybackSpeed() {
        const status = document.getElementById("speedStatus");
        try {
            video.defaultPlaybackRate = selectedPlaybackRate;
            video.playbackRate = selectedPlaybackRate;
            status.textContent = "";
        } catch (error) {
            status.textContent = "This browser could not apply that playback speed.";
        }
    }

    playbackSpeed.addEventListener("change", () => {
        const rate = Number(playbackSpeed.value);
        if (!playbackRates.has(rate)) return;
        selectedPlaybackRate = rate;
        applyPlaybackSpeed();
    });
    // Reapply the selected rate when a source or proxy segment is replaced.
    video.addEventListener("loadedmetadata", applyPlaybackSpeed);


    // Browser-owned video controls do not reliably expose a loading spinner.
    // App operations and media buffering own independent reasons so an early
    // canplay event cannot hide a proxy-preparation or seek indicator.
    const loadingReasons = new Map();
    let mediaLoadingTimer = null;

    function renderPlayerLoading() {
        const text = loadingReasons.get("seek") || loadingReasons.get("proxy") ||
            loadingReasons.get("media") || "";
        document.getElementById("playerLoading").classList.toggle("hidden", !text);
        document.getElementById("videoStage").setAttribute("aria-busy", String(!!text));
        const label = document.getElementById("playerLoadingText");
        if (label.textContent !== text) label.textContent = text;
    }

    function setPlayerLoading(reason, text) {
        loadingReasons.set(reason, text);
        renderPlayerLoading();
    }

    function clearPlayerLoading(reason) {
        if (reason === "media" && mediaLoadingTimer) {
            clearTimeout(mediaLoadingTimer);
            mediaLoadingTimer = null;
        }
        loadingReasons.delete(reason);
        renderPlayerLoading();
    }

    function resetPlayerLoading() {
        clearTimeout(mediaLoadingTimer);
        mediaLoadingTimer = null;
        loadingReasons.clear();
        renderPlayerLoading();
    }

    function showMediaLoading() {
        if (video.error || video.ended || (!video.seeking && video.paused)) return;
        if (mediaLoadingTimer) return;
        mediaLoadingTimer = setTimeout(() => {
            mediaLoadingTimer = null;
            if (!video.error && !video.ended &&
                    (video.seeking || (!video.paused && video.readyState < 3))) {
                setPlayerLoading("media", video.seeking ? "Seeking…" : "Buffering…");
            }
        }, 150);
    }

    function clearMediaLoadingIfReady() {
        if (video.readyState >= 2 && !video.seeking) clearPlayerLoading("media");
    }

    ["waiting", "stalled", "seeking"].forEach(event =>
        video.addEventListener(event, showMediaLoading));
    ["loadeddata", "canplay", "playing", "seeked"].forEach(event =>
        video.addEventListener(event, clearMediaLoadingIfReady));
    video.addEventListener("pause", () => {
        if (!video.seeking) clearPlayerLoading("media");
    });
    video.addEventListener("ended", () => clearPlayerLoading("media"));
    video.addEventListener("error", () => {
        resetPlayerLoading();
        document.getElementById("selectedFile").textContent =
            "The preview could not be loaded. Select the video again to retry.";
    });

    let hls = null;
    let currentProxy = null;
    let sourceDuration = 0;
    let activeFile = null;
    let proxyOffset = 0;
    let selectionBusy = false;
    let pendingSelection = null;
    let queuedSeek = null;
    let seekWorkerActive = false;
    let seekIntentActive = false;
    let seekIntentTarget = 0;
    let seekPlaybackWanted = false;
    let seekRevision = 0;
    let sourceSelectionEpoch = 0;

    function cancelPendingSeeks() {
        sourceSelectionEpoch += 1;
        seekRevision += 1;
        queuedSeek = null;
        seekIntentActive = false;
        clearPlayerLoading("seek");
    }

    function sourceTime() {
        return proxyOffset + (Number(video.currentTime) || 0);
    }
    function updateSourceClock() {
        const time = seekIntentActive ? seekIntentTarget :
            (currentlyUsingProxy && !restoringPlayhead ? sourceTime() : pendingResumeSeconds);
        document.getElementById("sourceClock").textContent =
            `${formatClock(time)} / ${formatClock(sourceDuration)}`;
    }
    function showPipeline(status) {
        // Pipeline/GPU details stay in the server logs; the GUI only shows errors.
        document.getElementById("pipelineStatus").textContent = "";
    }

    function destroyHls() {
        if (hls) {
            try { hls.destroy(); } catch (_) {}
            hls = null;
        }
    }

    // Centralized source loader. Handles HLS (.m3u8) via hls.js for
    // Chrome/Edge/Firefox and falls back to native playback (Safari/iOS,
    // or the original mp4 file). Resolves once the stream is ready so
    // callers can safely restore the resume position.
    function setVideoSrc(url) {
        destroyHls();

        const isHls = url.includes("/api/proxy/playlist") || url.includes(".m3u8");
        const appleBrowser = /iPhone|iPad|iPod/.test(navigator.userAgent) ||
            (/Safari/.test(navigator.userAgent) && !/Chrome|Chromium|Edg|Android/.test(navigator.userAgent));
        const preferNative = appleBrowser && video.canPlayType("application/vnd.apple.mpegurl");

        return new Promise((resolve, reject) => {
            const timeout = setTimeout(
                () => { cleanup(); reject(new Error("Load timed out")); },
                15000
            );

            const cleanup = () => {
                clearTimeout(timeout);
                video.removeEventListener("loadedmetadata", onReady);
                video.removeEventListener("error", onError);
            };

            const onReady = () => { cleanup(); resolve(); };
            const onError = () => { cleanup(); reject(new Error("Media could not be loaded")); };

            video.addEventListener("loadedmetadata", onReady);
            video.addEventListener("error", onError);

            // Prefer native HLS on Safari/iOS for system playback and PiP.
            if (isHls && !preferNative
                    && window.Hls && Hls.isSupported()) {
                hls = new Hls({
                    // This is an event/VOD-style proxy, not a true low-latency
                    // live stream. Normal buffering is more stable and avoids
                    // unnecessary stalls on phones and slower Wi-Fi links.
                    lowLatencyMode: false,
                    startPosition: Math.max(0, pendingResumeSeconds - proxyOffset),
                    liveSyncDuration: 86400,
                    maxLiveSyncPlaybackRate: 1,
                    enableWorker: true,
                    backBufferLength: 90,
                    maxBufferLength: 60,
                    maxMaxBufferLength: 180,
                    manifestLoadingMaxRetry: 8,
                    levelLoadingMaxRetry: 8,
                    fragLoadingMaxRetry: 8,
                    fragLoadingRetryDelay: 500,
                });

                hls.loadSource(url);
                hls.attachMedia(video);

                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    // The manifest can be parsed before the media element has
                    // metadata or a seekable timeline. Only finish here when
                    // the element is genuinely ready; otherwise
                    // loadedmetadata will finish the load.
                    if (video.readyState >= 1) {
                        onReady();
                    }
                });

                hls.on(Hls.Events.ERROR, (_event, data) => {
                    if (!data || !data.fatal) {
                        return;
                    }

                    // Recover from temporary Wi-Fi/network interruptions and
                    // decoder hiccups instead of leaving the video paused.
                    if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
                        try {
                            hls.startLoad(video.currentTime || -1);
                            return;
                        } catch (_) {}
                    }

                    if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
                        try {
                            hls.recoverMediaError();
                            return;
                        } catch (_) {}
                    }

                    cleanup();
                    reject(new Error(
                        "Proxy stream error: " + (data.details || "fatal")
                    ));
                });
            } else {
                // Safari/iOS native HLS, or a plain mp4 (the original file).
                video.src = url;
                video.load();
            }
        });
    }

    let markInSeconds = null;
    let markOutSeconds = null;
    let pendingResumeSeconds = 0;
    let playWhenProxyReady = true;
    let sessionSaveTimer = null;
    let lastSavedSessionJson = "";
    let restoringPlayhead = false;

    function waitForMediaProgress(timeoutMs = 1200) {
        return new Promise(resolve => {
            let finished = false;
            const events = [
                "loadedmetadata",
                "durationchange",
                "progress",
                "canplay",
                "seeked",
                "timeupdate"
            ];

            const finish = () => {
                if (finished) return;
                finished = true;
                clearTimeout(timer);
                for (const eventName of events) {
                    video.removeEventListener(eventName, finish);
                }
                resolve();
            };

            const timer = setTimeout(finish, timeoutMs);
            for (const eventName of events) {
                video.addEventListener(eventName, finish, {once: true});
            }
        });
    }

    async function seekVideoToSavedTime(seconds, watchToken = proxyWatchToken) {
        const requestedTime = Math.max(0, (Number(seconds) || 0) - proxyOffset);

        if (requestedTime === 0) {
            video.currentTime = 0;
            return proxyOffset;
        }

        const deadline = Date.now() + 30000;
        let lastError = null;

        while (Date.now() < deadline) {
            if (watchToken !== proxyWatchToken) throw new Error("Selection changed");
            let target = requestedTime;

            // Wait until the browser exposes a range that contains the saved
            // timestamp. This is essential for an HLS proxy that has only just
            // been attached to the media element.
            if (video.seekable && video.seekable.length > 0) {
                let matchingRange = null;

                for (let index = 0; index < video.seekable.length; index += 1) {
                    const start = video.seekable.start(index);
                    const end = video.seekable.end(index);
                    if (requestedTime >= start - 0.5 && requestedTime <= end + 0.5) {
                        matchingRange = {start, end};
                        break;
                    }
                }

                if (!matchingRange) {
                    await waitForMediaProgress();
                    continue;
                }

                target = Math.min(
                    Math.max(requestedTime, matchingRange.start),
                    Math.max(matchingRange.start, matchingRange.end - 0.05)
                );

                try {
                    if (hls) {
                        hls.startLoad(target);
                    }

                    video.currentTime = target;
                } catch (error) {
                    lastError = error;
                    await waitForMediaProgress();
                    continue;
                }

                await waitForMediaProgress(1800);

                const actualTime = Number(video.currentTime);
                if (
                    Number.isFinite(actualTime) &&
                    Math.abs(actualTime - target) <= 2
                ) {
                    return proxyOffset + actualTime;
                }
            } else {
                await waitForMediaProgress();
            }
        }

        throw lastError || new Error(
            `Could not seek to ${formatClock(requestedTime)}`
        );
    }

    async function api(url, options = {}) {
        const response = await fetch(url, options);

        if (!response.ok) {
            let message = `Request failed: ${response.status}`;

            try {
                const data = await response.json();
                message = data.detail || message;
            } catch (_) {}

            throw new Error(message);
        }

        return response.json();
    }

    function optionalSessionTime(value) {
        if (value === null || value === undefined || value === "") {
            return null;
        }

        const parsed = Number(value);
        return Number.isFinite(parsed) && parsed >= 0 ? parsed : null;
    }

    function editorSessionPayload() {
        if (!currentSourcePath) {
            return null;
        }

        const displayedTime = sourceTime();
        const currentTime = seekIntentActive ? seekIntentTarget : (
            currentlyUsingProxy &&
            !restoringPlayhead &&
            Number.isFinite(displayedTime)
                ? displayedTime
                : pendingResumeSeconds
        );

        return {
            path: currentSourcePath,
            current_time: Math.max(0, Number(currentTime) || 0),
            mark_in: optionalSessionTime(markInSeconds),
            mark_out: optionalSessionTime(markOutSeconds),
            clip_name: document.getElementById("clipName").value,
            render_mode: document.getElementById("renderMode").value,
            prefix: document.getElementById("prefix").value
        };
    }

    async function saveEditorSessionNow() {
        if (sessionSaveTimer) {
            clearTimeout(sessionSaveTimer);
            sessionSaveTimer = null;
        }

        const payload = editorSessionPayload();
        if (!payload) {
            return;
        }

        const serialized = JSON.stringify(payload);
        if (serialized === lastSavedSessionJson) {
            return;
        }

        await api("/api/session", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: serialized
        });
        lastSavedSessionJson = serialized;
    }

    function scheduleEditorSessionSave(immediate = false) {
        if (!currentSourcePath) {
            return;
        }

        if (sessionSaveTimer) {
            if (!immediate) {
                return;
            }
            clearTimeout(sessionSaveTimer);
        }

        sessionSaveTimer = setTimeout(() => {
            sessionSaveTimer = null;
            saveEditorSessionNow().catch(() => {});
        }, immediate ? 0 : 1200);
    }

    function saveEditorSessionBeacon() {
        const payload = editorSessionPayload();
        if (!payload || !navigator.sendBeacon) {
            return;
        }

        const serialized = JSON.stringify(payload);
        const body = new Blob([serialized], {type: "application/json"});
        navigator.sendBeacon("/api/session", body);
    }

    function applyEditorSession(session = {}) {
        pendingResumeSeconds = Math.max(
            0,
            Number(session.current_time) || 0
        );
        markInSeconds = optionalSessionTime(session.mark_in);
        markOutSeconds = optionalSessionTime(session.mark_out);

        document.getElementById("clipName").value =
            typeof session.clip_name === "string" ? session.clip_name : "";

        const renderMode = ["individual", "reel", "both"].includes(
            session.render_mode
        ) ? session.render_mode : "individual";
        document.getElementById("renderMode").value = renderMode;

        document.getElementById("prefix").value =
            typeof session.prefix === "string" && session.prefix
                ? session.prefix
                : "neoclip_output";

        updateMarkStatus();
    }

    async function loadFiles({restoreLastSession = false} = {}) {
        try {
            const [files, savedState] = await Promise.all([
                api("/api/files"),
                api("/api/state")
            ]);

            const box = document.getElementById("files");
            box.innerHTML = "";

            document.getElementById("fileStatus").textContent =
                `${files.length} video file(s) found — ` +
                `${savedState.total_queued_clips} unsaved clip(s) queued`;

            for (const file of files) {
                const button = document.createElement("button");
                button.className = "file-button";

                const queuedCount = savedState.clip_counts[file.path] || 0;
                const queuedText = queuedCount
                    ? ` — ${queuedCount} queued clip${queuedCount === 1 ? "" : "s"}`
                    : "";

                button.innerHTML =
                    `<strong>${escapeHtml(file.name)}${queuedText}</strong>` +
                    `<span class="path">${escapeHtml(file.path)}</span>`;

                button.onclick = () => selectVideo(file);
                box.appendChild(button);
            }

            if (restoreLastSession && savedState.source_path) {
                const previousFile = files.find(
                    file => file.path === savedState.source_path
                );

                if (previousFile) {
                    await selectVideo(previousFile, {
                        session: savedState.current_session,
                        autoplay: false,
                        scroll: false
                    });
                }
            }
        } catch (error) {
            document.getElementById("fileStatus").textContent = error.message;
        }
    }

    let proxyWatchToken = 0;
    let currentlyUsingProxy = false;
    let currentSourcePath = null;
    let heartbeatTimer = null;

    video.addEventListener("timeupdate", () => {
        if (currentlyUsingProxy && !restoringPlayhead && !seekIntentActive) {
            pendingResumeSeconds = Math.max(
                0,
                sourceTime()
            );
        }
        updateSourceClock();
        scheduleEditorSessionSave();
    });
    video.addEventListener("seeked", () => {
        if (!restoringPlayhead) scheduleEditorSessionSave(true);
    });
    video.addEventListener("pause", () => {
        if (!restoringPlayhead) scheduleEditorSessionSave(true);
    });

    document.getElementById("clipName").addEventListener(
        "input",
        () => scheduleEditorSessionSave()
    );
    document.getElementById("renderMode").addEventListener(
        "change",
        () => scheduleEditorSessionSave(true)
    );
    document.getElementById("prefix").addEventListener(
        "input",
        () => scheduleEditorSessionSave()
    );

    function startHeartbeat(path) {
        stopHeartbeat();
        currentSourcePath = path;
        // Ping immediately, then every few seconds to keep the proxy alive
        // while the viewer is connected.
        const ping = async () => {
            if (!currentProxy || currentSourcePath !== path) return;
            try {
                const status = await api(`/api/proxy/status?id=${currentProxy.id}`);
                if (currentProxy?.id !== status.id) return;
                currentProxy = status;
                showPipeline(status);
                if (status.status === "error" || status.status === "stopped") {
                    document.getElementById("pipelineStatus").textContent =
                        `${status.message}. ${status.error || ""} Select the video again to resume.`;
                }
            } catch (_) {}
        };
        ping();
        heartbeatTimer = setInterval(ping, 3000);
    }

    function stopHeartbeat() {
        if (heartbeatTimer) {
            clearInterval(heartbeatTimer);
            heartbeatTimer = null;
        }
    }

    // If playback enters a waiting/stalled state, ask hls.js to resume loading.
    // This handles brief network gaps without requiring the user to press play.
    video.addEventListener("waiting", () => {
        if (hls) {
            try { hls.startLoad(video.currentTime || -1); } catch (_) {}
        }
    });

    video.addEventListener("stalled", () => {
        if (hls) {
            try { hls.startLoad(video.currentTime || -1); } catch (_) {}
        }
    });

    // Resume segment loading on a stall, but NEVER replace the media source
    // just because seeking/buffering took a few seconds.
    let playbackWatchdogTimer = null;
    let watchdogLastTime = 0;
    let watchdogStuckChecks = 0;
    let userWantsPlayback = false;

    video.addEventListener("play", () => {
        userWantsPlayback = true;
        watchdogLastTime = Number(video.currentTime) || 0;
        watchdogStuckChecks = 0;
    });

    video.addEventListener("pause", () => {
        // Do not treat a pause caused by buffering as an intentional pause.
        if (!video.ended && video.readyState >= 3) {
            userWantsPlayback = false;
        }
    });

    function startPlaybackWatchdog() {
        if (playbackWatchdogTimer) return;

        playbackWatchdogTimer = setInterval(async () => {
            if (!hls || !userWantsPlayback || video.ended || video.seeking ||
                    seekIntentActive || restoringPlayhead || !currentlyUsingProxy) {
                watchdogLastTime = Number(video.currentTime) || 0;
                watchdogStuckChecks = 0;
                return;
            }

            const now = Number(video.currentTime) || 0;
            const advanced = now > watchdogLastTime + 0.15;

            if (advanced) {
                watchdogLastTime = now;
                watchdogStuckChecks = 0;
                return;
            }

            watchdogStuckChecks += 1;

            // After roughly four seconds without progress, force hls.js to
            // discard its failed request state and request the current area.
            if (watchdogStuckChecks % 2 === 0) {
                try {
                    hls.startLoad(Math.max(0, now - 0.5));
                } catch (_) {}
            }
        }, 2000);
    }

    startPlaybackWatchdog();

    // Persist the final playhead/mark state during page teardown. The proxy is
    // intentionally left cached for the idle reaper so a short return can
    // resume instantly instead of transcoding the video again from the start.
    window.addEventListener("pagehide", () => {
        saveEditorSessionBeacon();
        stopHeartbeat();
    });

    function resumeVisiblePlayer() {
        if (!currentSourcePath || document.visibilityState === "hidden") return;
        startHeartbeat(currentSourcePath);
        clearMediaLoadingIfReady();
        // Resume requests on the existing attachment, never replace the source.
        // Native HLS remains under the browser's control.
        if (hls && currentlyUsingProxy && !restoringPlayhead &&
                !seekIntentActive && userWantsPlayback && !video.ended) {
            try { hls.startLoad(Math.max(0, Number(video.currentTime) || 0)); }
            catch (_) {}
            if (!video.paused) showMediaLoading();
        }
    }

    window.addEventListener("pageshow", event => {
        if (event.persisted) resumeVisiblePlayer();
    });

    document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "hidden") {
            saveEditorSessionBeacon();
        } else {
            resumeVisiblePlayer();
        }
    });

    async function deleteVideo() {
        if (!currentSourcePath) {
            return;
        }

        const name = currentSourcePath.split("/").pop();
        const confirmed = window.confirm(
            `Delete "${name}"?

This permanently removes the source file and its preview files.
This cannot be undone.`
        );
        if (!confirmed) {
            return;
        }

        const pathToDelete = currentSourcePath;
        cancelPendingSeeks();
        resetPlayerLoading();

        // Stop watching/heartbeating the current source.
        proxyWatchToken += 1;
        stopHeartbeat();
        currentlyUsingProxy = false;
        currentSourcePath = null;

        try {
            const result = await api("/api/media/delete", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({path: pathToDelete})
            });

            if (!result.ok || result.exists !== false) {
                throw new Error("The server did not confirm that the file was removed.");
            }
        } catch (error) {
            alert("Delete failed: " + error.message);
            // Restore the selection and heartbeat so the user can retry.
            startHeartbeat(pathToDelete);
            return;
        }

        // Clear the player.
        destroyHls();
        video.pause();
        video.removeAttribute("src");
        video.load();

        markInSeconds = null;
        markOutSeconds = null;
        pendingResumeSeconds = 0;
        lastSavedSessionJson = "";
        if (sessionSaveTimer) {
            clearTimeout(sessionSaveTimer);
            sessionSaveTimer = null;
        }
        updateMarkStatus();
        document.getElementById("selectedFile").textContent = "";
        document.getElementById("playerSection").classList.add("hidden");

        await loadState();
        await loadFiles();
    }

    async function selectVideo(file, options = {}) {
        if (selectionBusy) {
            pendingSelection = {file, options};
            return;
        }
        selectionBusy = true;
        try {
        await saveEditorSessionNow().catch(() => {});
        cancelPendingSeeks();

        proxyWatchToken += 1;
        const thisWatchToken = proxyWatchToken;
        currentlyUsingProxy = false;
        currentProxy = null;
        resetPlayerLoading();
        setPlayerLoading("proxy", "Preparing preview…");
        playWhenProxyReady = options.autoplay !== false;
        lastSavedSessionJson = "";
        stopHeartbeat();
        currentSourcePath = file.path;
        activeFile = file;
        document.getElementById("playerSection").classList.remove("hidden");
        document.getElementById("selectedFile").textContent = file.path;

        const selectedState = await api("/api/source", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({path: file.path, current_time: options.session?.current_time})
        });

        applyEditorSession(
            options.session || selectedState.current_session || {}
        );
        currentProxy = selectedState.proxy;
        proxyOffset = currentProxy.start_seconds;
        sourceDuration = currentProxy.duration;
        pendingResumeSeconds = Math.min(pendingResumeSeconds, Math.max(0, sourceDuration - 1));
        startHeartbeat(file.path);
        updateSourceClock();

        // Show the player right away. The 360p proxy stream is attached as
        // soon as the first segments exist, so playback begins while the
        // proxy is still being built. We do not rely on the original file
        // here because many source containers (mkv/avi/...) will not play
        // in a browser at all.
        document.getElementById("selectedFile").textContent =
            file.path;

        // Kick off the player on a neutral source; watchProxyAndSwitch will
        // attach the live HLS playlist the moment it becomes playable.
        destroyHls();
        video.removeAttribute("src");
        video.load();

        document.getElementById("playerSection").classList.remove("hidden");

        // Watch the proxy in the background. Do not block the rest of the UI.
        watchProxyAndSwitch(file, thisWatchToken);

        await loadState();
        if (options.scroll !== false) {
            window.scrollTo({top: 0, behavior: "smooth"});
        }
        } catch (error) {
            resetPlayerLoading();
            document.getElementById("fileStatus").textContent = error.message;
            document.getElementById("selectedFile").textContent = error.message;
        } finally {
            selectionBusy = false;
            if (pendingSelection) {
                const next = pendingSelection;
                pendingSelection = null;
                await selectVideo(next.file, next.options);
            }
        }
    }

    async function watchProxyAndSwitch(file, watchToken) {
        while (
            watchToken === proxyWatchToken &&
            !currentlyUsingProxy
        ) {
            try {
                const status = await api(
                    `/api/proxy/status?id=${currentProxy.id}`
                );
                if (watchToken !== proxyWatchToken) return;
                currentProxy = status;
                showPipeline(status);

                if (status.status === "error" || status.status === "stopped") {
                    resetPlayerLoading();
                    document.getElementById("selectedFile").textContent =
                        `${file.path}: ${status.error || status.message}`;
                    return;
                }

                const available = Math.floor(
                    Number(status.available_end || 0)
                );
                const switchLead = Math.max(
                    1,
                    Number(status.switch_lead_seconds) || 1
                );
                const resumeReady = (
                    pendingResumeSeconds <= 0 ||
                    status.status === "ready" ||
                    available >= pendingResumeSeconds + switchLead
                );

                // When restoring a playhead, wait until the live proxy has
                // encoded that portion of the source before attaching it.
                setPlayerLoading("proxy", `Preparing preview at ${formatClock(pendingResumeSeconds)}…`);
                if (status.playable && resumeReady) {
                    const switched = await switchToProxy(
                        file,
                        status,
                        watchToken
                    );
                    if (switched) {
                        return;
                    }
                }

                document.getElementById("selectedFile").textContent =
                    file.path;

            } catch (error) {
                document.getElementById("selectedFile").textContent =
                    file.path;
            }

            // Poll quickly while the first segment is being written so playback
            // can start the moment it appears, then ease off.
            await new Promise(resolve => setTimeout(resolve, 400));
        }
    }

    async function switchToProxy(file, status, watchToken) {
        if (
            watchToken !== proxyWatchToken ||
            currentlyUsingProxy
        ) {
            return;
        }

        const resumeAt = Math.max(0, Number(pendingResumeSeconds) || 0);
        setPlayerLoading("proxy", `Loading preview at ${formatClock(resumeAt)}…`);
        currentlyUsingProxy = true;
        restoringPlayhead = true;

        document.getElementById("selectedFile").textContent =
            file.path;

        try {
            proxyOffset = status.start_seconds;
            await setVideoSrc(status.url || file.url);

            if (watchToken !== proxyWatchToken) {
                return false;
            }

            const restoredTime = await seekVideoToSavedTime(resumeAt, watchToken);
            if (watchToken !== proxyWatchToken) return false;
            pendingResumeSeconds = resumeAt > 0
                ? resumeAt
                : restoredTime;

            if (playWhenProxyReady) {
                // Mobile autoplay rejection is NOT a proxy/seek failure.
                try { await video.play(); } catch (error) {
                    if (error.name !== "NotAllowedError") throw error;
                    document.getElementById("pipelineStatus").textContent =
                        "Preview is ready. Tap Play.";
                }
            } else {
                video.pause();
            }
        } catch (error) {
            if (watchToken !== proxyWatchToken) return false;
            currentlyUsingProxy = false;
            document.getElementById("selectedFile").textContent =
                `${file.path} — resume failed: ${error.message}; retrying…`;
            return false;
        } finally {
            if (watchToken === proxyWatchToken) restoringPlayhead = false;
        }

        // The saved timestamp is protected while the stream is loading. Once
        // the verified seek has completed, normal timeupdate saves may resume.
        lastSavedSessionJson = "";
        scheduleEditorSessionSave(true);
        clearPlayerLoading("proxy");
        clearMediaLoadingIfReady();
        updateSourceClock();

        document.getElementById("selectedFile").textContent = file.path;
        return true;
    }

    function formatClock(seconds) {
        seconds = Math.max(0, Math.floor(Number(seconds) || 0));
        const hours = Math.floor(seconds / 3600);
        const minutes = Math.floor((seconds % 3600) / 60);
        const secs = seconds % 60;

        if (hours > 0) {
            return (
                String(hours).padStart(2, "0") + ":" +
                String(minutes).padStart(2, "0") + ":" +
                String(secs).padStart(2, "0")
            );
        }

        return (
            String(minutes).padStart(2, "0") + ":" +
            String(secs).padStart(2, "0")
        );
    }

    function togglePlayback() {
        if (video.paused) {
            video.play().catch(error => {
                document.getElementById("pipelineStatus").textContent = error.message;
            });
        } else video.pause();
    }

    function proxyContainsTime(status, target) {
        // Server-generated coverage, NOT the browser's transient MSE buffer.
        return !!status?.playable && target >= Number(status.start_seconds) &&
            target < Number(status.available_end) - 0.05;
    }

    async function seekWithinProxy(target, revision) {
        const local = Math.max(0, target - proxyOffset);
        restoringPlayhead = true;
        document.getElementById("selectedFile").textContent =
            activeFile.path;
        const deadline = Date.now() + 30000;
        let assigned = false;
        while (Date.now() < deadline && revision === seekRevision) {
            // hls.js can load a server-side segment even when it is outside
            // video.seekable. Native HLS may need its playlist refresh first.
            if (!assigned || Math.abs(video.currentTime - local) > 1) {
                try {
                    video.currentTime = local;
                    if (hls) hls.startLoad(local);
                    assigned = true;
                } catch (_) {}
            }
            if (assigned && !video.seeking && video.readyState >= 2 &&
                    Math.abs(video.currentTime - local) < 1) {
                pendingResumeSeconds = target;
                if (seekPlaybackWanted && video.paused) {
                    try { await video.play(); } catch (error) {
                        if (error.name !== "NotAllowedError") throw error;
                    }
                }
                watchdogLastTime = video.currentTime;
                watchdogStuckChecks = 0;
                return;
            }
            await waitForMediaProgress(250);
        }
        if (revision === seekRevision) {
            throw new Error(`Proxy still buffering at ${formatClock(target)}; source kept loaded. Try the seek again.`);
        }
    }

    async function seekSource(seconds) {
        if (!activeFile || selectionBusy) return;
        if (!seekIntentActive) seekPlaybackWanted = !video.paused;
        seekIntentActive = true;
        seekIntentTarget = Math.min(Math.max(Number(seconds) || 0, 0),
            Math.max(0, sourceDuration - .2));
        queuedSeek = {target: seekIntentTarget, revision: ++seekRevision,
            path: activeFile.path, epoch: sourceSelectionEpoch};
        setPlayerLoading("seek", `Seeking to ${formatClock(seekIntentTarget)}…`);
        updateSourceClock();
        await drainSeekRequests();
    }

    async function drainSeekRequests() {
        if (seekWorkerActive) return;
        seekWorkerActive = true;
        let lastEpoch = sourceSelectionEpoch;
        try {
            while (queuedSeek) {
                // Collapse slider releases/rapid taps into the latest intent.
                await new Promise(resolve => setTimeout(resolve, 100));
                const request = queuedSeek;
                queuedSeek = null;
                if (!request || request.path !== activeFile?.path) continue;
                const {target, revision, path, epoch} = request;
                lastEpoch = epoch;
                const valid = () => epoch === sourceSelectionEpoch &&
                    revision === seekRevision && path === activeFile?.path;
                try {
                    pendingResumeSeconds = target;
                    let status = currentProxy;
                    if (!proxyContainsTime(status, target)) {
                        status = await api(`/api/proxy/status?id=${currentProxy.id}`);
                        if (!valid()) continue;
                        if (status.id === currentProxy.id) currentProxy = status;
                    }
                    // Briefly wait for a nearby encode edge instead of
                    // discarding a growing proxy for an ordinary +10 skip.
                    const waitUntil = Date.now() + 8000;
                    while (valid() && status.status === "creating" &&
                            target >= status.start_seconds &&
                            target >= status.available_end - .05 &&
                            target - status.available_end <= 8 &&
                            Date.now() < waitUntil) {
                        document.getElementById("selectedFile").textContent =
                            path;
                        setPlayerLoading("seek", `Waiting for preview at ${formatClock(target)}…`);
                        await new Promise(resolve => setTimeout(resolve, 400));
                        if (!valid()) break;
                        status = await api(`/api/proxy/status?id=${status.id}`);
                        if (valid()) currentProxy = status;
                    }
                    if (!valid()) continue;
                    if (currentlyUsingProxy && proxyContainsTime(status, target)) {
                        await seekWithinProxy(target, revision);
                    } else {
                        // Ask the server BEFORE clearing anything. It may
                        // return the same job, or an already-cached window.
                        const next = await api("/api/proxy/start", {
                            method: "POST", headers: {"Content-Type": "application/json"},
                            body: JSON.stringify({path, current_time: target})
                        });
                        if (!valid()) continue;
                        if (currentlyUsingProxy && next.id === currentProxy.id) {
                            currentProxy = next;
                            await seekWithinProxy(target, revision);
                        } else {
                            const token = ++proxyWatchToken;
                            currentlyUsingProxy = false;
                            restoringPlayhead = true;
                            video.pause();
                            currentProxy = next;
                            proxyOffset = next.start_seconds;
                            pendingResumeSeconds = Math.min(target, sourceDuration - .2);
                            playWhenProxyReady = seekPlaybackWanted;
                            startHeartbeat(path);
                            // Only this genuinely different window reattaches
                            // HLS; it never requires a page/video-file reload.
                            await watchProxyAndSwitch(activeFile, token);
                        }
                    }
                    if (valid()) {
                        document.getElementById("selectedFile").textContent =
                            path;
                    }
                } catch (error) {
                    if (valid()) document.getElementById("selectedFile").textContent = error.message;
                } finally {
                    if (valid()) restoringPlayhead = false;
                }
            }
        } finally {
            seekWorkerActive = false;
            if (!queuedSeek && lastEpoch === sourceSelectionEpoch) {
                seekIntentActive = false;
                restoringPlayhead = false;
                clearPlayerLoading("seek");
                clearMediaLoadingIfReady();
                scheduleEditorSessionSave(true);
            }
            updateSourceClock();
        }
    }

    function skip(seconds) {
        const base = seekIntentActive ? seekIntentTarget :
            (currentlyUsingProxy ? sourceTime() : pendingResumeSeconds);
        return seekSource(base + seconds);
    }

    function jumpToTime() {
        const value = document.getElementById("jumpTime").value.trim();
        if (!/^\d+(?::\d{1,2}){0,2}(?:\.\d+)?$/.test(value)) {
            document.getElementById("jumpTimeHelp").textContent = "Enter seconds, mm:ss, or hh:mm:ss.";
            return;
        }
        seekSource(value.split(":").reduce((acc, part) => acc * 60 + Number(part), 0));
    }
    document.getElementById("jumpTime").addEventListener("keydown", event => {
        if (event.key === "Enter") {
            event.preventDefault();
            jumpToTime();
        }
    });

    function markIn() {
        if (!currentlyUsingProxy || restoringPlayhead) return;
        markInSeconds = sourceTime();
        updateMarkStatus();
        scheduleEditorSessionSave(true);
    }

    function markOut() {
        if (!currentlyUsingProxy || restoringPlayhead) return;
        markOutSeconds = sourceTime();
        updateMarkStatus();
        scheduleEditorSessionSave(true);
    }

    function updateMarkStatus() {
        document.getElementById("markStatus").innerHTML =
            `IN: ${formatTime(markInSeconds)}<br>` +
            `OUT: ${formatTime(markOutSeconds)}`;
    }

    async function addClip() {
        if (markInSeconds === null || markOutSeconds === null) {
            alert("Set both IN and OUT first.");
            return;
        }

        if (markOutSeconds <= markInSeconds) {
            alert("OUT must be after IN.");
            return;
        }

        const name = document.getElementById("clipName").value.trim();

        try {
            await api("/api/clips", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({
                    name,
                    start_s: markInSeconds,
                    end_s: markOutSeconds
                })
            });

            document.getElementById("clipName").value = "";
            markInSeconds = null;
            markOutSeconds = null;
            updateMarkStatus();
            scheduleEditorSessionSave(true);
            await loadState();
            await loadFiles();

        } catch (error) {
            alert(error.message);
        }
    }

    async function removeClip(index) {
        await api(`/api/clips/${index}`, {method: "DELETE"});
        await loadState();
        await loadFiles();
    }

    async function clearClips() {
        await api("/api/clips", {method: "DELETE"});
        await loadState();
        await loadFiles();
    }

    async function loadState() {
        const data = await api("/api/state");
        const list = document.getElementById("clipList");
        list.innerHTML = "";

        if (data.clips.length === 0) {
            list.innerHTML = `<p class="status">No clips queued.</p>`;
            return;
        }

        for (let i = 0; i < data.clips.length; i++) {
            const clip = data.clips[i];
            const row = document.createElement("div");
            row.className = "clip";

            row.innerHTML =
                `<div>` +
                `<strong>${i + 1}. ${escapeHtml(clip.name)}</strong><br>` +
                `<span class="status">${formatTime(clip.start_s)} → ` +
                `${formatTime(clip.end_s)}</span>` +
                `</div>` +
                `<button onclick="removeClip(${i})">Remove</button>`;

            list.appendChild(row);
        }
    }

    async function startRender() {
        const mode = document.getElementById("renderMode").value;
        const prefix = document.getElementById("prefix").value.trim()
            || "neoclip_output";

        try {
            await api("/api/render", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({mode, prefix})
            });
        } catch (error) {
            alert(error.message);
        }
    }

    async function cancelRender() {
        await api("/api/render/cancel", {method: "POST"});
    }

    let previousRenderStatus = "";
    async function pollRender() {
        try {
            const data = await api("/api/render/status");

            document.getElementById("progress").value = data.progress;

            document.getElementById("renderStatus").textContent =
                data.error
                    ? `${data.message}: ${data.error}`
                    : `${data.message || data.status}` +
                      (data.current_file ? ` — ${data.current_file}` : "") +
                      (data.pipeline ? ` · ${data.pipeline}` : "");

            if (data.status === "done" && previousRenderStatus !== "done") {
                await loadState();
                await loadFiles();
            }
            previousRenderStatus = data.status;
        } catch (_) {}

        setTimeout(pollRender, 1000);
    }

    function formatTime(seconds) {
        if (seconds === null || !Number.isFinite(Number(seconds))) {
            return "not set";
        }

        seconds = Number(seconds);
        const whole = Math.floor(seconds);
        const hours = Math.floor(whole / 3600);
        const minutes = Math.floor((whole % 3600) / 60);
        const secs = whole % 60;
        const milliseconds = Math.floor((seconds % 1) * 1000);

        return (
            String(hours).padStart(2, "0") + ":" +
            String(minutes).padStart(2, "0") + ":" +
            String(secs).padStart(2, "0") + "." +
            String(milliseconds).padStart(3, "0")
        );
    }

    function escapeHtml(value) {
        const div = document.createElement("div");
        div.textContent = value;
        return div.innerHTML;
    }

    async function initializeEditor() {
        if (!window.NEOCLIP_PREVIEW && "serviceWorker" in navigator && window.isSecureContext) {
            navigator.serviceWorker.register("/sw.js").catch(() => {});
        }
        await loadFiles({restoreLastSession: true});

        if (!currentSourcePath) {
            await loadState();
        }

        pollRender();
    }

    initializeEditor();
